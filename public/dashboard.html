<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BrokersSync &mdash; Performance Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a24;
    --border: #223044;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header .status {
    font-size: 13px;
    color: var(--muted);
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 32px 64px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .demo-banner {
    background: #1e2a1b;
    border: 1px solid #365a2a;
    color: #9ade8a;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: end;
    flex-wrap: wrap;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field select {
    padding: 9px 10px;
    background: #0e1420;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    min-width: 160px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .card .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .card .value {
    font-size: 28px;
    font-weight: 700;
  }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    padding: 12px 0;
  }
</style>
</head>
<body>
<header>
  <h1>BrokersSync &mdash; Performance Dashboard</h1>
  <div class="status" id="refreshStatus">--</div>
</header>

<main>
  <div class="demo-banner">
    Showing simulated trade data for UI/UX testing. No broker connection required.
  </div>

  <section class="panel">
    <h2>Instrument</h2>
    <div class="controls">
      <div class="field">
        <label for="symbol">Symbol</label>
        <select id="symbol">
          <option value="EURUSD">EURUSD</option>
          <option value="XAUUSD">XAUUSD</option>
          <option value="US30">US30</option>
          <option value="GBPUSD">GBPUSD</option>
        </select>
      </div>
    </div>
  </section>

  <section class="cards">
    <div class="card">
      <div class="label">Total P&amp;L</div>
      <div class="value" id="metricPnl">--</div>
    </div>
    <div class="card">
      <div class="label">Win Rate</div>
      <div class="value" id="metricWinRate">--</div>
    </div>
    <div class="card">
      <div class="label">Total Trades</div>
      <div class="value" id="metricTradeCount">--</div>
    </div>
  </section>

  <section class="panel" style="margin-top:20px;">
    <h2>Recent Trades</h2>
    <div id="tradesContainer" class="empty-state">Loading simulated trades...</div>
  </section>
</main>

<script>
  const REFRESH_INTERVAL_MS = 5000;
  const SYMBOL_BASE_PRICE = { EURUSD: 1.085, XAUUSD: 2334, US30: 39500, GBPUSD: 1.27 };
  const SYMBOL_PIP = { EURUSD: 0.0001, XAUUSD: 0.1, US30: 1, GBPUSD: 0.0001 };
  let tradesBySymbol = {};

  const el = {
    symbol: document.getElementById('symbol'),
    refreshStatus: document.getElementById('refreshStatus'),
    metricPnl: document.getElementById('metricPnl'),
    metricWinRate: document.getElementById('metricWinRate'),
    metricTradeCount: document.getElementById('metricTradeCount'),
    tradesContainer: document.getElementById('tradesContainer')
  };

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function generateTrade(symbol, closedAt) {
    const base = SYMBOL_BASE_PRICE[symbol];
    const pip = SYMBOL_PIP[symbol];
    const entryPrice = Number((base + randomBetween(-40, 40) * pip).toFixed(5));
    const direction = Math.random() > 0.5 ? 1 : -1;
    const moveInPips = randomBetween(2, 60);
    const exitPrice = Number((entryPrice + direction * moveInPips * pip * (Math.random() > 0.35 ? 1 : -1)).toFixed(5));
    const quantity = Number(randomBetween(0.1, 2).toFixed(2));
    const pnl = Number(((exitPrice - entryPrice) * direction * quantity * (symbol === 'US30' ? 1 : 10000)).toFixed(2));

    return {
      symbol,
      quantity,
      entryPrice,
      exitPrice,
      entryDate: new Date(closedAt - randomBetween(60000, 3600000)).toISOString(),
      exitDate: new Date(closedAt).toISOString(),
      pnl
    };
  }

  function seedTrades(symbol) {
    const now = Date.now();
    const trades = [];
    for (let i = 40; i > 0; i--) {
      trades.push(generateTrade(symbol, now - i * randomBetween(300000, 900000)));
    }
    return trades;
  }

  function getTrades(symbol) {
    if (!tradesBySymbol[symbol]) {
      tradesBySymbol[symbol] = seedTrades(symbol);
    }
    return tradesBySymbol[symbol];
  }

  function calculateMetrics(trades) {
    const totalTrades = trades.length;
    if (totalTrades === 0) {
      return { totalTrades: 0, totalPnl: 0, winRate: 0 };
    }
    const wins = trades.filter((t) => t.pnl > 0);
    const totalPnl = trades.reduce((sum, t) => sum + t.pnl, 0);
    return {
      totalTrades,
      totalPnl,
      winRate: (wins.length / totalTrades) * 100
    };
  }

  function formatMoney(value) {
    const n = Number(value) || 0;
    const sign = n > 0 ? '+' : '';
    return sign + '$' + n.toFixed(2);
  }

  function renderTrades(trades) {
    if (!trades || trades.length === 0) {
      el.tradesContainer.className = 'empty-state';
      el.tradesContainer.textContent = 'No trades found for this symbol.';
      return;
    }

    const rows = trades.slice(-25).slice().reverse().map((t) => {
      const pnlClass = t.pnl >= 0 ? 'positive' : 'negative';
      return '<tr>' +
        '<td>' + t.symbol + '</td>' +
        '<td>' + t.quantity + '</td>' +
        '<td>' + t.entryPrice + '</td>' +
        '<td>' + t.exitPrice + '</td>' +
        '<td class="' + pnlClass + '">' + formatMoney(t.pnl) + '</td>' +
        '<td>' + new Date(t.exitDate).toLocaleString() + '</td>' +
        '</tr>';
    }).join('');

    el.tradesContainer.className = '';
    el.tradesContainer.innerHTML =
      '<table><thead><tr>' +
      '<th>Symbol</th><th>Qty</th><th>Entry</th><th>Exit</th><th>P&amp;L</th><th>Closed</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function refresh() {
    const symbol = el.symbol.value;
    const trades = getTrades(symbol);

    // Simulate a live feed: occasionally close a new trade on refresh.
    if (Math.random() > 0.5) {
      trades.push(generateTrade(symbol, Date.now()));
    }

    const metrics = calculateMetrics(trades);
    el.metricPnl.textContent = formatMoney(metrics.totalPnl);
    el.metricPnl.className = 'value ' + (metrics.totalPnl >= 0 ? 'positive' : 'negative');
    el.metricWinRate.textContent = metrics.winRate.toFixed(1) + '%';
    el.metricTradeCount.textContent = metrics.totalTrades;

    renderTrades(trades);
    el.refreshStatus.textContent = 'Last updated ' + new Date().toLocaleTimeString();
  }

  el.symbol.addEventListener('change', refresh);

  refresh();
  setInterval(refresh, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
